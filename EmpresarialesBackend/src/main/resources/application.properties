spring.application.name=POCEmpleado
server.port=8080

# Spring Security
spring.security.user.name=admin
spring.security.user.password=admin

# ===== ORACLE DATABASE CONFIGURATION =====
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/xepdb1
spring.datasource.username=DAE2025
spring.datasource.password=DAE2025
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ===== JPA / HIBERNATE CONFIGURATION =====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# ===== MICROSERVICIO CONDUCTORES CONFIGURATION =====
conductor.service.url=http://localhost:8081/api/conductor
conductor.service.username=admin
conductor.service.password=admin